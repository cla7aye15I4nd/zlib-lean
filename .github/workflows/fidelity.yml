name: C translation fidelity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  clang-archive-equal:
    runs-on: ubuntu-24.04
    env:
      LEAN_NUM_THREADS: 3
      CLANG: /usr/bin/clang-18
      CC: /usr/bin/clang-18
      AR: /usr/bin/llvm-ar-18
      RANLIB: /usr/bin/llvm-ranlib-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - name: Install the pinned Lean and LLVM toolchains
        run: |
          sudo apt-get update -qq && sudo apt-get install -y elan clang-18 llvm-18
          elan toolchain install "$(cat lean-toolchain)"
      - name: Build Lean libraries and C emitter
        run: make build
      - name: Verify public API Verus contract coverage and TCB hygiene
        run: make check-api && make check-tcb
      - name: Emit standalone C ABI units
        run: bin/lean2c abi-sources build/abi-sources
      - name: Verify 15/15 byte-for-byte archive equality with pinned Clang
        run: python3 tools/archive.py --pinned --lean-dir build/abi-sources
      - uses: actions/upload-artifact@v4
        with:
          name: lean-abi-sources
          path: build/abi-sources
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-clang-archive-comparison
          path: build/archive-*/report.json
          if-no-files-found: error

  compcert-archive-equal:
    runs-on: ubuntu-24.04
    needs: clang-archive-equal
    container:
      image: coqorg/coq:8.20
      options: --user root
    env:
      OPAMYES: "1"
      OPAMROOT: /home/coq/.opam
      OPAMROOTISOK: "1"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory '*'
      - name: Download Lean-emitted C sources
        uses: actions/download-artifact@v4
        with:
          name: lean-abi-sources
          path: build/abi-sources
      - name: Cache OPAM switch with CompCert
        uses: actions/cache@v4
        with:
          path: /home/coq/.opam
          key: compcert-coq-8.20-v2
      - name: Install CompCert toolchain
        run: |
          apt-get update -qq && apt-get install -y python3 gcc make binutils git m4 unzip pkg-config libgmp-dev
          eval "$(opam env --root=/home/coq/.opam --set-root)"
          if ! command -v ccomp >/dev/null 2>&1; then
            opam repo list --short | grep -qx coq-released || opam repo add coq-released https://coq.inria.fr/opam/released
            opam update -y
            opam install -y -j "$(nproc)" coq-compcert
          fi
          ccomp -version || ccomp --version
      - name: Verify 15/15 byte-for-byte archive equality with CompCert
        run: |
          eval "$(opam env --root=/home/coq/.opam --set-root)"
          python3 tools/archive.py --compcert --lean-dir build/abi-sources
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-compcert-archive-comparison
          path: build/archive-*/report.json
          if-no-files-found: warn
